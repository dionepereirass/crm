# ==============================================================================
# BET CRM — Nginx Production Configuration (HTTPS / SSL / Reverse Proxy)
# ==============================================================================

# HTTP -> HTTPS Redirection + Certbot ACME Challenge
server {
    listen 80;
    listen [::]:80;
    server_name ${APP_DOMAIN:-localhost};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Production HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${APP_DOMAIN:-localhost};

    root /var/www/backend/public;
    index index.php index.html;

    # SSL / TLS Modern Configuration
    ssl_certificate /etc/letsencrypt/live/${APP_DOMAIN:-localhost}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${APP_DOMAIN:-localhost}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Production Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Client limits and timeouts
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Health Checks to Backend
    location /health {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # API Endpoints to Backend PHP-FPM
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Horizon Monitoring Dashboard to Backend
    location /horizon {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM Processing
    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 90;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Frontend Reverse Proxy (Next.js Production Server)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Block access to hidden files and sensitive project structures
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* /(composer\.(json|lock)|package(-lock)?\.json|\.env.*|\.git|vendor|node_modules|storage/logs|Dockerfile|docker-compose.*)/ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
