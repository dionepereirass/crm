services:
  nginx:
    image: nginx:alpine
    container_name: bet_crm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - bet_crm_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bet_crm_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - bet_crm_network

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: bet_crm_backend
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=bet_crm
      - DB_USERNAME=bet_crm_user
      - DB_PASSWORD=change_this_secret_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - MOCK_PROVIDERS=true
    depends_on:
      - postgres
      - redis
    networks:
      - bet_crm_network

  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: bet_crm_queue_worker
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    environment:
      - APP_ENV=local
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=bet_crm
      - DB_USERNAME=bet_crm_user
      - DB_PASSWORD=change_this_secret_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    command: php artisan queue:work redis --queue=webhooks,emails,sms,automations,reports,default --tries=3 --timeout=90
    depends_on:
      - backend
      - redis
      - postgres
    networks:
      - bet_crm_network

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: bet_crm_horizon
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    environment:
      - APP_ENV=local
      - DB_HOST=postgres
      - REDIS_HOST=redis
    command: php artisan horizon
    depends_on:
      - backend
      - redis
    networks:
      - bet_crm_network

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: bet_crm_scheduler
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    depends_on:
      - backend
      - redis
      - postgres
    networks:
      - bet_crm_network

  postgres:
    image: postgres:16-alpine
    container_name: bet_crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bet_crm
      POSTGRES_USER: bet_crm_user
      POSTGRES_PASSWORD: change_this_secret_password
    ports:
      - "5432:5432"
    volumes:
      - bet_crm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bet_crm_user -d bet_crm"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bet_crm_network

  redis:
    image: redis:7-alpine
    container_name: bet_crm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - bet_crm_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bet_crm_network

networks:
  bet_crm_network:
    driver: bridge

volumes:
  bet_crm_postgres_data:
    driver: local
  bet_crm_redis_data:
    driver: local
